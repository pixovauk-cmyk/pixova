fragment BlogParts on Blog {
  __typename
  title
  seoTitle
  description
  pubDate
  updatedDate
  primaryKeyword
  heroImage
  readTime
  avatar
  body
}

fragment HomepageParts on Homepage {
  __typename
  urgencyBar {
    __typename
    badge
    message
    highlight
    linkHref
  }
  hero {
    __typename
    headline
    headlineHighlight
    subheadline
  }
  liveStats {
    __typename
    sitesThisWeek
    inProgress
    launchedThisMonth
    latestLaunchName
    latestLaunchUrl
  }
  testimonials {
    __typename
    name
    role
    badge
    image
    quote
  }
  faq {
    __typename
    question
    answer
  }
}
